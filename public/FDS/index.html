<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FDS — Fresno Design System</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============ FDS TOKENS ============ */
:root, [data-theme="light"]{
  --text-primary:#141414; --text-secondary:#4a4d4b; --text-tertiary:#636965;
  --text-inverse-primary:#f4f2ea; --text-brand:#344e9b;
  --bg-page:#ecebe6; --bg-surface:#f4f2ea; --bg-subtle:#c9c5bd; --bg-inverse-surface:#242625;
  --bg-brand:#c6dbf9; --bg-brand-subtle:#dce8fc;
  --border-default:#c9c5bd; --border-subtle:#dad8d2; --border-strong:#a9aea9; --border-strongest:#141414;
  --feedback-success:#38ae7a; --feedback-warning:#e0ac3a; --feedback-error:#e0655a; --feedback-info:#5a82d2;
  --logo-accent:#003dff;
  --icon-default:#141414; --icon-muted:#636965; --icon-disabled:#a9aea9; --icon-inverse:#f4f2ea;
  --shadow:0 8px 24px rgba(20,20,20,.10); --shadow-sm:0 4px 14px rgba(20,20,20,.08);
}
[data-theme="dark"]{
  --text-primary:#f4f2ea; --text-secondary:#c9c5bd; --text-tertiary:#a9aea9;
  --text-inverse-primary:#141414; --text-brand:#a3c3f3;
  --bg-page:#242625; --bg-surface:#141414; --bg-subtle:#373737; --bg-inverse-surface:#ecebe6;
  --bg-brand:#c6dbf9; --bg-brand-subtle:#1a2340;
  --border-default:#4a4d4b; --border-subtle:#373737; --border-strong:#636965; --border-strongest:#f4f2ea;
  --feedback-success:#38ae7a; --feedback-warning:#e0ac3a; --feedback-error:#e0655a; --feedback-info:#5a82d2;
  --logo-accent:#003dff;
  --icon-default:#f4f2ea; --icon-muted:#a9aea9; --icon-disabled:#636965; --icon-inverse:#141414;
  --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-sm:0 4px 16px rgba(0,0,0,.4);
}
/* scales (mode-independent) */
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-full:999px;
  --font-body:'Switzer',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-ui:'Geist Mono',ui-monospace,monospace;
  --font-editorial:'Instrument Serif',Georgia,serif;
  --sidebar-w:280px;
}
/* ============ RESET ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font-body);background:var(--bg-page);color:var(--text-primary);line-height:1.5;
  transition:background .35s ease,color .35s ease}
a{color:inherit;text-decoration:none}
::selection{background:var(--bg-brand);color:#141414}
/* mono helpers */
.mono{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em}
.kicker{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--text-tertiary)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;
  background:var(--bg-surface);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;transition:background .35s ease,border-color .35s ease}
.brand{padding:24px 24px 18px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .lock{display:flex;align-items:center;color:var(--text-primary)}
.brand .logo{height:15px;width:auto;display:block;color:var(--text-primary)}
.brand .ver{font-family:var(--font-ui);font-size:10px;letter-spacing:.1em;color:var(--text-tertiary);text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 0 28px}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:8px}
.nav-group{margin-top:0}
.nav-group:not(:first-child){border-top:1px solid var(--border-subtle);margin-top:0}
.nav-group:first-child{margin-top:2px}
.nav-group > .glabel{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--text-tertiary);padding:16px 24px 8px}
.nav-sub{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.11em;font-size:9px;color:var(--text-tertiary);padding:14px 24px 4px;opacity:.7}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 24px;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);
  transition:background .14s ease,color .14s ease;cursor:pointer;position:relative}
.nav a:hover{background:var(--bg-page);color:var(--text-primary)}
.nav a.active{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.nav a.active .dot{background:var(--text-inverse-primary)}
.sidebar-foot{padding:16px;border-top:1px solid var(--border-subtle)}

/* theme switch — segmented control, FDS style */
.seg{display:flex;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:3px;width:100%}
.seg button{flex:1;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:10px;
  color:var(--text-secondary);padding:7px 0;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s ease}
.seg button.on{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.seg svg{width:13px;height:13px}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;background:color-mix(in srgb,var(--bg-page) 86%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-subtle);transition:background .35s ease,border-color .35s ease}
.topbar .crumbs{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary)}
.topbar .crumbs .clink{color:var(--text-secondary);cursor:pointer;transition:color .14s ease}
.topbar .crumbs .clink:hover{color:var(--text-primary)}
.topbar .crumbs .cmid{color:var(--text-tertiary)}
.topbar .crumbs .cur{color:var(--text-primary)}
.topbar .crumbs .csep{display:inline-flex;align-items:center;color:var(--text-tertiary)}
.topbar .crumbs .csep svg{width:13px;height:13px}
.content{padding:64px 40px 120px;max-width:1100px;width:100%}
@media(max-width:1100px){.content{padding:48px 28px 100px}}

/* section */
.section{display:none;animation:fade .4s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{margin-bottom:48px}
.sec-head .kicker{display:block;margin-bottom:14px}
.sec-title{font-family:var(--font-ui);font-weight:500;font-size:clamp(34px,5vw,56px);letter-spacing:-.01em;line-height:1;color:var(--text-primary)}
.sec-title .br{color:var(--text-tertiary);font-weight:400}
.sec-lede{font-size:18px;color:var(--text-secondary);max-width:60ch;margin-top:22px;line-height:1.6}

/* prose */
.prose h3{font-family:var(--font-body);font-weight:600;font-size:22px;margin:44px 0 14px;letter-spacing:-.01em}
.prose p{color:var(--text-secondary);max-width:68ch;margin-bottom:14px}
.prose strong{color:var(--text-primary);font-weight:600}
.prose code{font-family:var(--font-ui);font-size:.86em;background:var(--bg-subtle);padding:2px 6px;border-radius:6px;color:var(--text-primary)}

/* principle cards */
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.cols-3,.cols-2{grid-template-columns:1fr}}
.panel{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:24px;transition:background .35s ease,border-color .35s ease}
.panel .num{font-family:var(--font-ui);font-size:11px;letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:14px}
.panel h4{font-weight:600;font-size:16px;margin-bottom:8px}
.panel p{font-size:14px;color:var(--text-secondary);line-height:1.55}

/* token tiers */
.tiers{display:flex;flex-direction:column;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-top:8px}
.tier{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:22px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);align-items:start}
.tier:last-child{border-bottom:0}
.tier .t-name{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--text-primary)}
.tier .t-name span{display:block;color:var(--text-tertiary);font-size:10px;margin-top:6px}
.tier .t-desc{font-size:14px;color:var(--text-secondary)}
.tier .t-desc code{font-family:var(--font-ui);font-size:12px;color:var(--text-brand);background:var(--bg-brand-subtle);padding:2px 7px;border-radius:6px}
.tier .arrow{color:var(--text-tertiary)}

/* placeholder */
.placeholder{border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:64px 32px;text-align:center;color:var(--text-tertiary);
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:12px;background:var(--bg-surface)}
.placeholder b{display:block;color:var(--text-secondary);margin-bottom:6px}

/* color */
.grp-label{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary);margin:36px 0 14px}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-surface);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.swatch .chip{height:72px;border-bottom:1px solid var(--border-subtle)}
.swatch .meta{padding:10px 12px}
.swatch .tname{font-family:var(--font-ui);font-size:11px;color:var(--text-primary);word-break:break-all;line-height:1.4}
.swatch .thex{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;margin-top:3px}
.sem-table{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.sem-row{display:grid;grid-template-columns:36px 1fr 130px 130px;gap:16px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface);cursor:pointer;transition:background .12s ease}
.sem-row:last-child{border-bottom:0}
.sem-row:hover{background:var(--bg-page)}
.sem-row .sc{width:28px;height:28px;border-radius:8px;border:1px solid var(--border-default)}
.sem-row .sn{font-family:var(--font-ui);font-size:13px;color:var(--text-primary)}
.sem-row .sh{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase}
.sem-row .sh b{color:var(--text-secondary);font-weight:400}
.copyhint{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
@media(max-width:720px){.sem-row{grid-template-columns:32px 1fr}.sem-row .sh{display:none}}
.toast-copy{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-inverse-surface);color:var(--text-inverse-primary);font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px 18px;border-radius:var(--radius-full);opacity:0;transition:all .25s ease;pointer-events:none;z-index:100}
.toast-copy.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* typography */
.type-card{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:28px;margin-bottom:16px}
.type-card .role{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.type-card .fam{font-family:var(--font-ui);font-size:12px;color:var(--text-brand);margin-bottom:20px}
.type-card .big{color:var(--text-primary);line-height:1.05;margin-bottom:16px}
.type-card .sample{color:var(--text-secondary);max-width:60ch}
.scale-table{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-top:8px}
.scale-row{display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:baseline;padding:18px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.scale-row:last-child{border-bottom:0}
.scale-row .smp{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-row .lbl{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;text-align:right}
/* spacing */
.space-list{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:8px 20px}
.space-row{display:grid;grid-template-columns:120px 1fr 60px;gap:20px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.space-row:last-child{border-bottom:0}
.space-row .lbl{font-family:var(--font-ui);font-size:12px;color:var(--text-primary)}
.space-bar{height:18px;background:var(--bg-brand);border-radius:4px}
.space-row .px{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-align:right}
/* radius */
.radius-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.radius-box{height:110px;background:var(--bg-brand-subtle);border:1.5px solid var(--text-brand)}
.radius-cap{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;margin-top:10px}
.radius-cap b{color:var(--text-primary);font-weight:400}
/* elevation */
.elev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px;margin-top:8px}
.elev-card{height:130px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.elev-card .en{font-family:var(--font-ui);font-size:12px;color:var(--text-primary);text-transform:uppercase;letter-spacing:.06em}
.elev-card .ed{font-size:12px;color:var(--text-tertiary)}
/* icons */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.icon-cell{border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--icon-default)}
.icon-cell svg{width:24px;height:24px}
.icon-cell .inm{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary)}

.foot{margin-top:80px;padding-top:24px;border-top:1px solid var(--border-subtle);font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--text-tertiary);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* mobile sidebar toggle */
.menu-btn{display:none}
@media(max-width:840px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .3s ease}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--border-default);background:var(--bg-surface);border-radius:var(--radius-sm);cursor:pointer}
  .menu-btn svg{width:18px;height:18px;color:var(--text-primary)}
}
.scrim{display:none}
@media(max-width:840px){.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="lock"><svg class="logo" viewBox="0 0 234 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fresno"><path d="M223.381 15.7711C217.072 15.7711 213.231 12.7787 213.231 7.86535C213.231 2.95204 217.072 0 223.381 0C229.71 0 233.511 2.95204 233.511 7.86535C233.511 12.7787 229.71 15.7711 223.381 15.7711ZM223.381 13.7492C228.638 13.7492 231.125 11.6059 231.125 7.84513C231.125 4.12476 228.638 1.9815 223.381 1.9815C218.164 1.9815 215.617 4.12476 215.617 7.84513C215.617 11.6059 218.164 13.7492 223.381 13.7492ZM223.442 12.7382C219.721 12.7382 216.992 11.1207 216.992 7.86535C216.992 4.65047 219.721 2.99247 223.442 2.99247C227.02 2.99247 229.427 4.42805 229.77 6.91504H226.899C226.414 5.88385 225.342 5.11551 223.462 5.11551C221.137 5.11551 219.903 6.3489 219.903 7.86535C219.903 9.42225 221.137 10.6354 223.462 10.6354C225.302 10.6354 226.434 9.90751 226.899 8.8561H229.77C229.447 11.2824 227.02 12.7382 223.442 12.7382Z" fill="currentColor"/><path d="M189.041 28C176.979 28 169.836 23.0462 169.836 14V13.9641C169.836 4.88205 176.979 0 189.041 0C201.102 0 208.246 4.88205 208.246 13.9641V14C208.246 23.0462 201.102 28 189.041 28ZM189.041 21.359C194.677 21.359 198.482 18.6308 198.482 14V13.9641C198.482 9.29744 194.677 6.60513 189.041 6.60513C183.405 6.60513 179.6 9.15385 179.6 13.9641V14C179.6 18.7744 183.405 21.359 189.041 21.359Z" fill="currentColor"/><path d="M139.809 27.282H130.906V0.610229H140.922L158.153 17.0154L158.44 17.3384V0.610229H167.342V27.282H157.363L140.024 10.841L139.809 10.6256V27.282Z" fill="currentColor"/><path d="M112.67 28C101.183 28 96.6241 23.4051 96.4087 18.1282H105.598C105.742 20.5333 107.465 21.7897 112.742 21.7897C117.229 21.7897 118.845 20.9282 118.845 19.4564C118.845 18.2359 118.342 17.6615 111.557 16.9436C99.5318 15.7949 97.4497 12.4564 97.4497 8.07692C97.4497 3.94872 100.896 0 111.988 0C122.829 0 127.137 4.2 127.604 9.8H118.773C118.45 7.89744 117.122 6.17436 112.347 6.17436C108.327 6.17436 106.963 6.9641 106.963 8.2564       <div class="ver">DS · v0.1</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="seg" role="tablist" aria-label="Theme">
        <button id="btn-light" class="on" onclick="setTheme('light')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>Light
        </button>
        <button id="btn-dark" onclick="setTheme('dark')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark
        </button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeNav()"></div>

/* flat index of id -> label */
const LABELS={}; const CRUMB_MID={};
NAV.forEach(g=>{(g.items||[]).forEach(i=>{LABELS[i.id]=i.label; if(g.label) CRUMB_MID[i.id]=g.label;});(g.subs||[]).forEach(s=>s.items.forEach(i=>{LABELS[i.id]=i.label; CRUMB_MID[i.id]=s.label;}));});
function buildCrumb(id){

  const parts=[`<a class="clink" href="#overview">FDS</a>`];
  if(CRUMB_MID[id]) parts.push(`<span class="cmid">${CRUMB_MID[id]}</span>`);
  parts.push(`<span class="cur">${LABELS[id]||id}</span>`);

}

R.overview=()=>`
  <div class="sec-head">

    <div class="panel"><div class="num">02</div><h4>Mode-aware</h4><p>Light and dark are two modes of the same semantic layer. Switch the mode, the whole system follows — including this page.</p></div>

function copyToken(name){
  try{navigator.clipboard.writeText(name);}catch(e){}
  const t=document.getElementById('toastCopy'); t.textContent='Copied · '+name; t.classList.add('show');
  clearTimeout(window.__ct); window.__ct=setTimeout(()=>t.classList.remove('show'),1400);
}

function placeholder(id){
  return `
  <div class="sec-head">

}

/* ============ SIDEBAR BUILD ============ */
function buildNav(){
  const nav=document.getElementById('nav');
  let html='';
  NAV.forEach(g=>{
    html+='<div class="nav-group">';
    if(g.label) html+=`<div class="glabel">${g.label}</div>`;
    if(g.items) g.items.forEach(i=>{ html+=link(i); });
    if(g.subs) g.subs.forEach(s=>{ html+=`<div class="nav-sub">${s.label}</div>`; s.items.forEach(i=>{ html+=link(i); }); });
    html+='</div>';
  });
  nav.innerHTML=html;
}
function link(i){ return `<a data-id="${i.id}" href="#${i.id}" onclick="closeNav()">${i.label}</a>`; }

/* ============ ROUTING ============ */
function render(id){
  if(!LABELS[id]&&id!=='overview') id='overview';
  const content=document.getElementById('content');
  content.innerHTML=`<section class="section active" id="sec-${id}">${(R[id]?R[id]():placeholder(id))}</section>`;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  document.getElementById('crumbs').innerHTML=buildCrumb(id);
  document.title=`FDS — ${LABELS[id]||id}`;
  content.scrollTop=0; window.scrollTo(0,0);
}
function route(){ const id=(location.hash||'#overview').slice(1); render(id); }
window.addEventListener('hashchange',route);

/* ============ THEME ============ */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('btn-light').classList.toggle('on',t==='light');
  document.getElementById('btn-dark').classList.toggle('on',t==='dark');
  try{localStorage.setItem('fds-theme',t)}catch(e){}
}
function initTheme(){ let t='light'; try{t=localStorage.getItem('fds-theme')||'light'}catch(e){} setTheme(t); }

/* mobile nav */
function openNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show')}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')}

/* init */
buildNav(); initTheme(); route();
</script>
