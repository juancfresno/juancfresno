<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FDS — Fresno Design System</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============ FDS TOKENS ============ */
:root, [data-theme="light"]{
  --text-primary:#141414; --text-secondary:#373737; --text-tertiary:#4a4d4b;
  --text-inverse-primary:#f4f2ea; --text-inverse-secondary:#c9c5bd; --text-inverse-tertiary:#a9aea9; --text-brand:#344e9b;
  --bg-page:#ecebe6; --bg-surface:#f4f2ea; --bg-subtle:#c9c5bd; --bg-inverse-surface:#242625; --bg-inverse-subtle:#373737;
  --bg-brand:#c6dbf9; --bg-brand-subtle:#dce8fc;
  --border-default:#c9c5bd; --border-subtle:#dad8d2; --border-strong:#a9aea9; --border-strongest:#141414;
  --feedback-success:#38ae7a; --feedback-warning:#e0ac3a; --feedback-error:#a6423b; --feedback-info:#5a82d2;
  --logo-accent:#003dff;
  --icon-default:#141414; --icon-muted:#636965; --icon-disabled:#a9aea9; --icon-inverse:#f4f2ea; --btn-focus:#4063c2;
  --button-bg-primary:#c6dbf9; --button-bg-primary-hover:#a3c3f3; --button-bg-primary-active:#7ba1e8; --button-text-primary:#141414;
  --button-bg-neutral:#141414; --button-bg-neutral-hover:#373737; --button-bg-neutral-active:#4a4d4b; --button-text-neutral:#f4f2ea;
  --button-border-outline:#141414; --button-bg-outline-hover:#ecebe6; --button-bg-outline-active:#dad8d2;
  --button-bg-disabled:#dad8d2; --button-text-disabled:#a9aea9; --button-border-outline-disabled:#c9c5bd; --button-border-focus:#4063c2;
  --shadow-xs:0 1px 2px rgba(24,26,25,.05);
  --shadow-sm:0 1px 3px rgba(24,26,25,.1),0 1px 2px -1px rgba(24,26,25,.1);
  --shadow-md:0 4px 6px -1px rgba(24,26,25,.1),0 2px 4px -2px rgba(24,26,25,.1);
  --shadow-lg:0 10px 15px -3px rgba(24,26,25,.1),0 4px 6px -4px rgba(24,26,25,.1);
  --shadow-xl:0 20px 25px -5px rgba(24,26,25,.1),0 8px 10px -6px rgba(24,26,25,.1);
  --shadow-2xl:0 25px 50px -12px rgba(24,26,25,.25);
  --shadow:var(--shadow-lg);
}
[data-theme="dark"]{
  --text-primary:#f4f2ea; --text-secondary:#c9c5bd; --text-tertiary:#a9aea9;
  --text-inverse-primary:#141414; --text-inverse-secondary:#4a4d4b; --text-inverse-tertiary:#636965; --text-brand:#a3c3f3;
  --bg-page:#242625; --bg-surface:#141414; --bg-subtle:#373737; --bg-inverse-surface:#ecebe6; --bg-inverse-subtle:#dad8d2;
  --bg-brand:#c6dbf9; --bg-brand-subtle:#1a2340;
  --border-default:#4a4d4b; --border-subtle:#373737; --border-strong:#636965; --border-strongest:#f4f2ea;
  --feedback-success:#38ae7a; --feedback-warning:#e0ac3a; --feedback-error:#e2685d; --feedback-info:#5a82d2;
  --logo-accent:#003dff;
  --icon-default:#f4f2ea; --icon-muted:#a9aea9; --icon-disabled:#636965; --icon-inverse:#141414; --btn-focus:#a3c3f3;
  --button-bg-primary:#c6dbf9; --button-bg-primary-hover:#dce8fc; --button-bg-primary-active:#f0f5fe; --button-text-primary:#141414;
  --button-bg-neutral:#f4f2ea; --button-bg-neutral-hover:#ecebe6; --button-bg-neutral-active:#dad8d2; --button-text-neutral:#141414;
  --button-border-outline:#f4f2ea; --button-bg-outline-hover:rgba(244,242,234,.12); --button-bg-outline-active:rgba(244,242,234,.2);
  --button-bg-disabled:#373737; --button-text-disabled:#636965; --button-border-outline-disabled:#4a4d4b; --button-border-focus:#a3c3f3;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5),0 1px 2px -1px rgba(0,0,0,.5);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.5);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.55),0 4px 6px -4px rgba(0,0,0,.55);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.6),0 8px 10px -6px rgba(0,0,0,.6);
  --shadow-2xl:0 25px 50px -12px rgba(0,0,0,.7);
  --shadow:var(--shadow-lg);
}
/* scales (mode-independent) */
:root{
  --space-0:0;--space-px:1px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:28px;--space-8:32px;--space-9:36px;--space-10:40px;--space-11:44px;--space-12:48px;--space-14:56px;--space-16:64px;--space-20:80px;--space-24:96px;--space-28:112px;--space-32:128px;--space-36:144px;--space-40:160px;--space-48:192px;--space-50:200px;--space-56:224px;--space-64:256px;
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-full:9999px;
  --target-web:24px;--target-touch:44px;
  --font-body:'Switzer',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-ui:'Geist Mono',ui-monospace,monospace;
  --font-editorial:'Instrument Serif',Georgia,serif;
  --sidebar-w:280px;
}
/* ============ RESET ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font-body);background:var(--bg-page);color:var(--text-primary);line-height:1.5;
  transition:background .35s ease,color .35s ease}
a{color:inherit;text-decoration:none}
::selection{background:var(--bg-brand);color:#141414}
/* mono helpers */
.mono{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em}
.kicker{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--text-tertiary)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;
  background:var(--bg-surface);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;transition:background .35s ease,border-color .35s ease}
.brand{padding:24px 24px 18px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .lock{display:flex;align-items:center;color:var(--text-primary)}
.brand .logo{height:15px;width:auto;display:block;color:var(--text-primary)}
.brand .ver{font-family:var(--font-ui);font-size:10px;letter-spacing:.1em;color:var(--text-tertiary);text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 0 28px}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:8px}
.nav-group{margin-top:0}
.nav-group:not(:first-child){border-top:1px solid var(--border-subtle);margin-top:0}
.nav-group:first-child{margin-top:2px}
.nav-group > .glabel{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--text-tertiary);padding:16px 24px 8px}
.nav-sub{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.11em;font-size:9px;color:var(--text-tertiary);padding:14px 24px 4px;opacity:.7}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 24px;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);
  transition:background .14s ease,color .14s ease;cursor:pointer;position:relative}
.nav a:hover{background:var(--bg-page);color:var(--text-primary)}
.nav a.active{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.nav a.active .dot{background:var(--text-inverse-primary)}
.sidebar-foot{padding:16px;border-top:1px solid var(--border-subtle)}

/* theme switch — segmented control, FDS style */
.seg{display:flex;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:3px;width:100%}
.seg button{flex:1;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:10px;
  color:var(--text-secondary);padding:7px 0;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s ease}
.seg button.on{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.seg svg{width:13px;height:13px}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;background:color-mix(in srgb,var(--bg-page) 86%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-subtle);transition:background .35s ease,border-color .35s ease}
.topbar .crumbs{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary)}
.topbar .crumbs .clink{color:var(--text-secondary);cursor:pointer;transition:color .14s ease}
.topbar .crumbs .clink:hover{color:var(--text-primary)}
.topbar .crumbs .cmid{color:var(--text-tertiary)}
.topbar .crumbs .cur{color:var(--text-primary)}
.topbar .crumbs .csep{display:inline-flex;align-items:center;color:var(--text-tertiary)}
.topbar .crumbs .csep svg{width:13px;height:13px}
.content{padding:64px 40px 120px;max-width:1100px;width:100%}
@media(max-width:1100px){.content{padding:48px 28px 100px}}

/* section */
.section{display:none;animation:fade .4s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{margin-bottom:48px}
.sec-head .kicker{display:block;margin-bottom:14px}
.sec-title{font-family:var(--font-ui);font-weight:500;font-size:clamp(34px,5vw,56px);letter-spacing:-.01em;line-height:1;color:var(--text-primary)}
.sec-title .br{color:var(--text-tertiary);font-weight:400}
.sec-lede{font-size:18px;color:var(--text-secondary);max-width:60ch;margin-top:22px;line-height:1.6}

/* prose */
.prose h3{font-family:var(--font-body);font-weight:600;font-size:22px;margin:44px 0 14px;letter-spacing:-.01em}
.prose p{color:var(--text-secondary);max-width:68ch;margin-bottom:14px}
.prose strong{color:var(--text-primary);font-weight:600}
.prose code{font-family:var(--font-ui);font-size:.86em;background:var(--bg-subtle);padding:2px 6px;border-radius:6px;color:var(--text-primary)}

/* principle cards */
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.cols-3,.cols-2{grid-template-columns:1fr}}
.panel{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:24px;transition:background .35s ease,border-color .35s ease}
.panel .num{font-family:var(--font-ui);font-size:11px;letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:14px}
.panel h4{font-weight:600;font-size:16px;margin-bottom:8px}
.panel p{font-size:14px;color:var(--text-secondary);line-height:1.55}

/* token tiers */
.tiers{display:flex;flex-direction:column;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-top:8px}
.tier{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:22px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);align-items:start}
.tier:last-child{border-bottom:0}
.tier .t-name{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--text-primary)}
.tier .t-name span{display:block;color:var(--text-tertiary);font-size:10px;margin-top:6px}
.tier .t-desc{font-size:14px;color:var(--text-secondary)}
.tier .t-desc code{font-family:var(--font-ui);font-size:12px;color:var(--text-brand);background:var(--bg-brand-subtle);padding:2px 7px;border-radius:6px}
.tier .arrow{color:var(--text-tertiary)}

/* placeholder */
.placeholder{border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:64px 32px;text-align:center;color:var(--text-tertiary);
  font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:12px;background:var(--bg-surface)}
.placeholder b{display:block;color:var(--text-secondary);margin-bottom:6px}

/* color */
.grp-label{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary);margin:36px 0 14px}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-surface);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.swatch .chip{height:72px;border-bottom:1px solid var(--border-subtle)}
.swatch .meta{padding:10px 12px}
.swatch .tname{font-family:var(--font-ui);font-size:11px;color:var(--text-primary);word-break:break-all;line-height:1.4}
.swatch .thex{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;margin-top:3px}
.sem-table{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.sem-row{display:grid;grid-template-columns:36px 1fr 130px 130px;gap:16px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface);cursor:pointer;transition:background .12s ease}
.sem-row:last-child{border-bottom:0}
.sem-row:hover{background:var(--bg-page)}
.sem-row .sc{width:28px;height:28px;border-radius:8px;border:1px solid var(--border-default)}
.sem-row .sn{font-family:var(--font-ui);font-size:13px;color:var(--text-primary)}
.sem-row .sh{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase}
.sem-row .sh b{color:var(--text-secondary);font-weight:400}
.copyhint{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
@media(max-width:720px){.sem-row{grid-template-columns:32px 1fr}.sem-row .sh{display:none}}
.toast-copy{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-inverse-surface);color:var(--text-inverse-primary);font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px 18px;border-radius:var(--radius-full);opacity:0;transition:all .25s ease;pointer-events:none;z-index:100}
.toast-copy.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* typography */
.type-card{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:28px;margin-bottom:16px}
.type-card .role{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.type-card .fam{font-family:var(--font-ui);font-size:12px;color:var(--text-brand);margin-bottom:20px}
.type-card .big{color:var(--text-primary);line-height:1.05;margin-bottom:16px}
.type-card .sample{color:var(--text-secondary);max-width:60ch}
.scale-table{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-top:8px}
.scale-row{display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:baseline;padding:18px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.scale-row:last-child{border-bottom:0}
.scale-row .smp{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-row .lbl{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;text-align:right}
/* spacing */
.space-list{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:8px 20px}
.space-row{display:grid;grid-template-columns:120px 1fr 60px;gap:20px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.space-row:last-child{border-bottom:0}
.space-row .lbl{font-family:var(--font-ui);font-size:12px;color:var(--text-primary)}
.space-bar{height:18px;background:var(--bg-brand);border-radius:4px}
.space-row .px{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-align:right}
/* radius */
.radius-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.radius-box{height:110px;background:var(--bg-brand-subtle);border:1.5px solid var(--text-brand)}
.radius-cap{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;margin-top:10px}
.radius-cap b{color:var(--text-primary);font-weight:400}
/* elevation */
.elev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px;margin-top:8px}
.elev-card{height:130px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.elev-card .en{font-family:var(--font-ui);font-size:12px;color:var(--text-primary);text-transform:uppercase;letter-spacing:.06em}
.elev-card .ed{font-size:12px;color:var(--text-tertiary)}
/* icons */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.icon-cell{border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--icon-default)}
.icon-cell svg{width:24px;height:24px}
.icon-cell .inm{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary)}

/* type scale */
.ts-row{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:baseline;padding:16px 18px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.ts-row:last-child{border-bottom:0}
.ts-row .smp{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ts-row .meta{text-align:right}
.ts-row .tn{font-family:var(--font-ui);font-size:12px;color:var(--text-primary)}
.ts-row .tm{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;white-space:nowrap}
@media(max-width:720px){.ts-row{grid-template-columns:1fr 104px}.ts-row .tm{white-space:normal}}

/* changelog */
.cl-entry{border-left:2px solid var(--border-default);padding-left:24px;margin-bottom:34px}
.cl-ver{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.cl-ver h3{font-family:var(--font-ui);font-size:17px;color:var(--text-primary)}
.cl-date{font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em}
.cl-note{color:var(--text-secondary);margin-bottom:14px}
.cl-item{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.cl-tag{font-family:var(--font-ui);font-size:9px;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:999px;flex-shrink:0;margin-top:2px;min-width:42px;text-align:center}
.cl-tag.add{background:rgba(56,174,122,.15);color:var(--feedback-success)}
.cl-tag.chg{background:rgba(90,130,210,.15);color:var(--feedback-info)}
.cl-tag.brk{background:rgba(224,101,90,.15);color:var(--feedback-error)}
.cl-item .txt{color:var(--text-secondary);font-size:14px;line-height:1.5}

/* component docs */
.cdoc-status{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-ui);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:5px 11px;border-radius:999px;margin-bottom:4px}
.cdoc-status.stable{background:rgba(56,174,122,.15);color:var(--feedback-success)}
.cdoc-status.draft{background:rgba(224,172,58,.15);color:var(--feedback-warning)}
.cdoc-status .d{width:6px;height:6px;border-radius:999px;background:currentColor}
.demo{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px}
.demo.dark-surface{background:var(--bg-surface);border-color:var(--border-subtle)}
.demo-label{font-family:var(--font-ui);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-tertiary);margin:24px 0 8px}
.props{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-top:8px;font-family:var(--font-ui)}
.props .ph,.props .pr{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:16px;padding:12px 18px;font-size:12px}
.props .ph{background:var(--bg-page);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.props .pr{border-top:1px solid var(--border-subtle);color:var(--text-secondary)}
.props .pr b{color:var(--text-primary);font-weight:400}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
@media(max-width:720px){.dodont{grid-template-columns:1fr}}
.dd{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.dd .ddh{font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:10px 16px;color:#fff}
.dd.do .ddh{background:var(--feedback-success)}
.dd.dont .ddh{background:var(--feedback-error)}
.dd .ddb{padding:18px 16px;background:var(--bg-surface);color:var(--text-secondary);font-size:14px;line-height:1.55}
.tokens-used{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tok{font-family:var(--font-ui);font-size:11px;color:var(--text-secondary);background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:999px;padding:5px 11px}

/* buttons */
.fbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent;border-radius:var(--radius-md);padding:11px 18px;cursor:pointer;transition:all .14s ease;white-space:nowrap}
.fbtn.sm{padding:8px 13px;font-size:11px}
.fbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.fbtn-primary{background:var(--button-bg-primary);color:var(--button-text-primary)}
.fbtn-primary:hover{background:var(--button-bg-primary-hover)}
.fbtn-primary:active{background:var(--button-bg-primary-active)}
.fbtn-neutral{background:var(--button-bg-neutral);color:var(--button-text-neutral)}
.fbtn-neutral:hover{background:var(--button-bg-neutral-hover)}
.fbtn-neutral:active{background:var(--button-bg-neutral-active)}
.fbtn-outline{background:transparent;border-color:var(--button-border-outline);color:var(--button-border-outline)}
.fbtn-outline:hover{background:var(--button-bg-outline-hover)}
.fbtn-outline:active{background:var(--button-bg-outline-active)}
.fbtn:disabled{background:var(--button-bg-disabled);color:var(--button-text-disabled);border-color:transparent;cursor:not-allowed}
.fbtn.focus{box-shadow:0 0 0 3px var(--button-border-focus)}
/* icon button */
.ibtn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);width:40px;height:40px;cursor:pointer;border:1px solid transparent;transition:all .14s ease}
.ibtn.sm{width:32px;height:32px}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.ibtn.sm svg{width:15px;height:15px}
.ibtn-primary{background:#c6dbf9;color:#141414}
.ibtn-primary:hover{background:#a3c3f3}
.ibtn-neutral{background:#141414;color:#f4f2ea}
.ibtn-neutral:hover{background:#373737}
.ibtn-outline{background:transparent;border-color:var(--border-strong);color:var(--icon-default)}
.ibtn-outline:hover{background:var(--bg-page)}
/* fab */
.fab{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--bg-inverse-surface);color:var(--text-inverse-primary);border:none;border-radius:var(--radius-full);cursor:pointer;box-shadow:var(--shadow-2xl);transition:all .14s ease;font-family:var(--font-ui);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.fab.circle{width:56px;height:56px;padding:0}
.fab:hover{background:var(--bg-inverse-subtle)}
.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

.foot{margin-top:80px;padding-top:24px;border-top:1px solid var(--border-subtle);font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--text-tertiary);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ============ v1.0.0 — Forms ============ */
.field{display:flex;flex-direction:column;gap:6px;width:240px}
.field-label{font-family:var(--font-ui);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-tertiary)}
.field-input{border:1.5px solid var(--border-strong);border-radius:var(--radius-md);padding:10px 14px;background:var(--bg-surface);color:var(--text-primary);font-family:var(--font-body);font-size:14px;width:100%;display:flex;align-items:center;gap:8px}
.field-input.focus{border-color:var(--text-primary);box-shadow:0 0 0 3px var(--btn-focus)}
.field-input.filled{border-color:var(--border-default)}
.field-input.error{border-color:var(--feedback-error)}
.field-input.disabled{border-color:var(--border-subtle);background:var(--bg-subtle);color:var(--text-tertiary)}
.field-hint{font-size:12px;color:var(--text-tertiary)}
.field-hint.error{color:var(--feedback-error)}
.field-input textarea,.field-input input{border:0;background:transparent;font:inherit;color:inherit;width:100%;outline:0}
textarea.field-input{align-items:flex-start;height:84px}
.field-input svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;color:var(--icon-muted)}
.select-input{justify-content:space-between;cursor:pointer}
.check-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-primary)}
.checkbox,.radio{width:18px;height:18px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--bg-surface)}
.checkbox{border-radius:var(--radius-sm)}
.radio{border-radius:var(--radius-full)}
.checkbox svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.checkbox.checked,.radio.selected{background:var(--bg-inverse-surface);border-color:transparent}
.radio .dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--bg-inverse-surface)}
.checkbox.disabled,.radio.disabled{border-color:var(--border-subtle);background:var(--bg-subtle)}
.toggle{width:44px;height:24px;border-radius:var(--radius-full);background:var(--border-default);padding:3px;cursor:pointer;transition:background .15s ease;display:inline-flex;align-items:center;flex-shrink:0}
.toggle.on{background:var(--bg-inverse-surface)}
.toggle.disabled{background:var(--bg-subtle);cursor:not-allowed}
.toggle .thumb{width:18px;height:18px;border-radius:var(--radius-full);background:var(--bg-surface);transition:transform .15s ease}
.toggle.on .thumb{transform:translateX(20px)}
.slider-wrap{width:240px}
.slider-track{width:100%;height:4px;border-radius:var(--radius-full);background:var(--bg-subtle);position:relative}
.slider-fill{height:4px;border-radius:var(--radius-full);background:var(--bg-inverse-surface);position:absolute;left:0;top:0}
.slider-thumb{width:16px;height:16px;border-radius:var(--radius-full);background:var(--bg-surface);border:2px solid var(--bg-inverse-surface);position:absolute;top:-6px}
.slider-wrap.disabled .slider-fill{background:var(--border-strong)}
.slider-wrap.disabled .slider-thumb{border-color:var(--border-strong)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden}
.stepper button{width:36px;background:var(--bg-surface);border:0;cursor:pointer;color:var(--text-primary);display:flex;align-items:center;justify-content:center}
.stepper button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.stepper .val{width:44px;text-align:center;font-family:var(--font-ui);font-size:13px;border-left:1px solid var(--border-default);border-right:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;color:var(--text-primary)}
.segctl{display:inline-flex;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:3px;gap:2px}
.segctl button{border:0;background:transparent;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:8px 18px;border-radius:var(--radius-full);cursor:pointer;color:var(--text-secondary)}
.segctl button.on{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.rating-row{display:flex;gap:4px}
.rating-row svg{width:20px;height:20px;stroke:var(--border-strong);fill:none;stroke-width:1.5}
.rating-row svg.filled{fill:var(--feedback-warning);stroke:var(--feedback-warning)}

/* ============ v1.0.0 — Feedback ============ */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--radius-md);border-left:3px solid;background:var(--bg-surface);border-top:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);max-width:480px}
.banner svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.banner .btitle{font-weight:600;font-size:14px;color:var(--text-primary);margin-bottom:2px}
.banner .btext{font-size:13px;color:var(--text-secondary)}
.banner.info{border-left-color:var(--feedback-info);color:var(--feedback-info)}
.banner.success{border-left-color:var(--feedback-success);color:var(--feedback-success)}
.banner.warning{border-left-color:var(--feedback-warning);color:var(--feedback-warning)}
.banner.error{border-left-color:var(--feedback-error);color:var(--feedback-error)}
.toast-demo{display:inline-flex;align-items:center;gap:10px;background:var(--bg-inverse-surface);color:var(--text-inverse-primary);padding:12px 18px;border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow-lg)}
.toast-demo svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tooltip-demo{display:inline-block;background:var(--bg-inverse-surface);color:var(--text-inverse-primary);padding:7px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:var(--font-ui)}
.modal-demo{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:24px;max-width:340px;box-shadow:var(--shadow-xl)}
.modal-demo h4{font-size:16px;font-weight:600;margin-bottom:8px}
.modal-demo p{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
.modal-demo .mactions{display:flex;gap:10px;justify-content:flex-end}
.badge-dot{width:8px;height:8px;border-radius:var(--radius-full);display:inline-block}
.badge-count{min-width:19px;height:19px;padding:0 6px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--font-ui);color:var(--text-inverse-primary)}
.badge-error{background:var(--feedback-error)}
.badge-neutral{background:var(--bg-inverse-surface)}
.progress-track{width:240px;height:8px;border-radius:var(--radius-full);background:var(--bg-subtle);overflow:hidden}
.progress-fill{height:100%;border-radius:var(--radius-full);background:var(--bg-inverse-surface)}
.spinner-el{width:24px;height:24px;border-radius:var(--radius-full);border:3px solid var(--bg-subtle);border-top-color:var(--bg-inverse-surface);animation:fds-spin .8s linear infinite}
@keyframes fds-spin{to{transform:rotate(360deg)}}
.skeleton-block{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:fds-pulse 1.6s ease-in-out infinite}
@keyframes fds-pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ============ v1.0.0 — Navigation ============ */
.topbar-demo{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);max-width:480px}
.tabbar-demo{display:flex;border-top:1px solid var(--border-subtle);padding-top:8px;max-width:320px}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-ui);font-size:9px;text-transform:uppercase;color:var(--text-tertiary);letter-spacing:.05em}
.tabbar-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.tabbar-item.active{color:var(--text-primary)}
.tabs-demo{display:flex;gap:28px;border-bottom:1px solid var(--border-subtle)}
.tabs-tab{padding-bottom:12px;font-family:var(--font-ui);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);border-bottom:2px solid transparent;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0}
.tabs-tab.active{color:var(--text-primary);border-bottom-color:var(--text-primary)}
.tabs-tab.disabled{color:var(--border-strong);cursor:not-allowed}
.pagination-demo{display:flex;gap:4px;align-items:center}
.page-chip{min-width:32px;height:32px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);font-family:var(--font-ui);font-size:12px;color:var(--text-secondary);cursor:pointer}
.page-chip.active{background:var(--bg-inverse-surface);color:var(--text-inverse-primary)}
.page-nav{color:var(--text-tertiary)}
.page-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.menu-demo{border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);padding:6px;display:flex;flex-direction:column;gap:2px;width:210px;box-shadow:var(--shadow-lg)}
.menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);cursor:pointer}
.menu-item:hover{background:var(--bg-subtle)}
.menu-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;color:var(--icon-muted)}
.menu-item.destructive{color:var(--feedback-error)}
.menu-item.destructive svg{color:var(--feedback-error)}
.menu-divider{height:1px;background:var(--border-subtle);margin:4px 2px}

/* ============ v1.0.0 — Data display ============ */
.card-demo{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);overflow:hidden;max-width:300px}
.card-media{height:140px;background:var(--bg-subtle)}
.card-body{padding:20px}
.card-meta{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.card-title{font-weight:600;font-size:16px;margin-bottom:8px;color:var(--text-primary)}
.card-text{font-size:14px;color:var(--text-secondary);line-height:1.5}
.table-demo{border:1px solid var(--border-subtle);border-radius:var(--radius-xl);overflow:hidden;background:var(--bg-surface)}
.table-demo table{width:100%;border-collapse:collapse}
.table-demo th{font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);text-align:left;padding:14px 16px;background:var(--bg-page)}
.table-demo td{padding:14px 16px;border-top:1px solid var(--border-subtle);font-size:14px;color:var(--text-primary);gap:6px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:11px;text-transform:uppercase}
.status-pill .dot{width:6px;height:6px;border-radius:var(--radius-full)}
.stat-card{border:1px solid var(--border-subtle);border-radius:var(--radius-xl);background:var(--bg-surface);padding:20px;width:200px}
.stat-label{font-family:var(--font-ui);font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em}
.stat-value{font-family:var(--font-ui);font-size:32px;margin:8px 0;color:var(--text-primary)}
.stat-delta{display:flex;align-items:center;gap:6px;font-size:12px}
.stat-delta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.stat-delta.up{color:var(--feedback-success)}
.stat-delta.down{color:var(--feedback-error)}
.stat-delta .vs{color:var(--text-tertiary)}
.list-item-demo{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-md);width:320px;cursor:pointer;color:var(--text-primary);font-size:14px}
.list-item-demo:hover{background:var(--bg-page)}
.list-item-demo.selected{background:var(--bg-brand-subtle)}
.list-item-demo.disabled{color:var(--text-tertiary);cursor:not-allowed}
.list-item-demo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;color:var(--icon-muted);flex-shrink:0}
.list-item-demo .lbl{flex:1}
.avatar{border-radius:var(--radius-full);background:var(--bg-brand-subtle);color:var(--text-brand);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-ui);flex-shrink:0}
.avatar.sm{width:24px;height:24px;font-size:10px}
.avatar.md{width:32px;height:32px;font-size:12px}
.avatar.lg{width:40px;height:40px;font-size:14px}
.avatar-group{display:inline-flex}
.avatar-group .avatar{margin-left:-8px;border:2px solid var(--bg-surface)}
.avatar-group .avatar:first-child{margin-left:0}
.tag-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);border:1px solid;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.chip-el{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-full);border:1px solid var(--border-default);font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);cursor:pointer}
.chip-el.selected{background:var(--bg-inverse-surface);color:var(--text-inverse-primary);border-color:transparent}
.chip-el.disabled{color:var(--text-tertiary);border-color:var(--border-subtle);cursor:not-allowed}
.divider-h{height:1px;background:var(--border-default);width:100%}
.divider-v{width:1px;height:60px;background:var(--border-default)}
.empty-state-demo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 32px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);max-width:340px}
.empty-state-demo svg{width:32px;height:32px;stroke:var(--icon-muted);fill:none;stroke-width:1.5;margin-bottom:18px}
.empty-state-demo h4{font-size:16px;font-weight:600;margin-bottom:6px}
.empty-state-demo p{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
.link-demo{font-size:14px;text-decoration:underline;text-underline-offset:3px}
.accordion-demo{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-surface);max-width:400px}
.accordion-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;font-weight:500;font-size:14px;color:var(--text-primary)}
.accordion-header svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s ease}
.accordion-item.expanded .accordion-header svg{transform:rotate(180deg)}
.accordion-body{padding:0 18px 18px;color:var(--text-secondary);font-size:14px;line-height:1.5;border-top:1px solid var(--border-subtle);padding-top:14px}
.accordion-item:not(.expanded) .accordion-body{display:none}
.accordion-item+.accordion-item{border-top:1px solid var(--border-subtle)}

/* mobile sidebar toggle */
.menu-btn{display:none}
@media(max-width:840px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .3s ease}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--border-default);background:var(--bg-surface);border-radius:var(--radius-sm);cursor:pointer}
  .menu-btn svg{width:18px;height:18px;color:var(--text-primary)}
}
.scrim{display:none}
@media(max-width:840px){.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}}
</style>

<body>
<div class="app">

];

/* flat index of id -> label */
const LABELS={}; const CRUMB_MID={};
NAV.forEach(g=>{(g.items||[]).forEach(i=>{LABELS[i.id]=i.label; if(g.label) CRUMB_MID[i.id]=g.label;});(g.subs||[]).forEach(s=>s.items.forEach(i=>{LABELS[i.id]=i.label; CRUMB_MID[i.id]=s.label;}));});
function buildCrumb(id){
  const sep=`<span class="csep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></svg></span>`;
  const parts=[`<a class="clink" href="#overview">FDS</a>`];
  if(CRUMB_MID[id]) parts.push(`<span class="cmid">${CRUMB_MID[id]}</span>`);
  parts.push(`<span class="cur">${LABELS[id]||id}</span>`);
  return parts.join(sep);
}

const R={};

R.overview=()=>`
  <div class="sec-head">
    <span class="kicker">Fresno© Design System · v1.0.0</span>
    <h1 class="sec-title"><span class="br">{</span> Overview <span class="br">}</span></h1>
    <p class="sec-lede">FDS is the shared design system for every Fresno© product — a single, mode-aware source of truth spanning web, apps and editorial surfaces. Built on a four-layer token architecture (Primitives → Brand → Semantic → Component), five brand contexts, and a three-family type system. v1.0.0 is a breaking release: see <a href="#changelog" style="text-decoration:underline">Changelog</a> for the full migration path.</p>
  </div>
  <div class="prose">
    <h3>Principles</h3>
  </div>
  <div class="grid cols-3" style="margin-top:18px">
    <div class="panel"><div class="num">01</div><h4>Token-driven</h4><p>Every color, space and radius is a token. No hardcoded values. Semantic tokens alias primitives, never raw hex.</p></div>
    <div class="panel"><div class="num">02</div><h4>Mode-aware</h4><p>Light and dark are two modes of the same semantic layer. Switch the mode, the whole system follows — including this page. Brand is a separate, independent axis.</p></div>
    <div class="panel"><div class="num">03</div><h4>Tailwind-aligned</h4><p>Naming and scales follow Tailwind conventions. Everything is English kebab-case, predictable and portable to code.</p></div>
  </div>
  <div class="prose">
    <h3>Token architecture</h3>
    <p>Four layers, each referencing the one above — see the full <a href="#token-architecture" style="text-decoration:underline">Token architecture</a> page for the mode matrix and migration notes. Components never touch primitives directly, and never expose a Theme prop.</p>
  </div>
  <div class="tiers">
    <div class="tier"><div class="t-name">Primitives<span>raw values</span></div><div class="t-desc">The palette and scales. Literal values: <code>blue-200 · #c6dbf9</code>, <code>space-4 · 16px</code>. Never used directly in components.</div></div>
    <div class="tier"><div class="t-name">Brand<span>identity · 5 modes</span></div><div class="t-desc">Fresno · Biakone · GLYF · Medida · Forma. Changes identity values, never component anatomy. Independent from Theme.</div></div>
    <div class="tier"><div class="t-name">Semantic<span>intent · mode-aware</span></div><div class="t-desc">Role-based aliases that carry light/dark: <code>text/primary</code>, <code>bg/surface</code>, <code>border/subtle</code>. The only Light/Dark switch, and the layer designers reach for.</div></div>
    <div class="tier"><div class="t-name">Component<span>scoped</span></div><div class="t-desc">Per-component tokens that alias semantics: <code>button/bg-primary</code>, <code>chip/text-selected</code>. Local control without breaking the system.</div></div>
  </div>
  <div class="prose">
    <h3>Type system</h3>
    <p><strong>Switzer</strong> carries body and headings, each in a Regular and a Light cut. <strong>Geist Mono</strong> (uppercase, tracked) handles display statements, UI, nav and labels. <strong>Instrument Serif</strong> covers editorial and quotes. This page uses all three.</p>
  </div>
  <div class="foot"><span>Fresno© — FDS</span><span>Private · juancfresno.com</span></div>
`;

R['token-architecture']=()=>`
  <div class="sec-head">
    <span class="kicker">Foundations</span>
    <h1 class="sec-title"><span class="br">{</span> Token architecture <span class="br">}</span></h1>
    <p class="sec-lede">One source of truth. Brand and Theme are independent axes — Brand carries identity (Fresno · Biakone · GLYF · Medida · Forma), Semantic is the <strong>only</strong> Light/Dark switch. Components never expose a Theme prop.</p>
  </div>
  <div class="tiers">
    <div class="tier"><div class="t-name">01 · Primitives<span>mode: Value</span></div><div class="t-desc">Raw values — color, spacing, radius, breakpoints, interaction targets. Literal, foundation-layer. Never used directly in components.</div></div>
    <div class="tier"><div class="t-name">02 · Brand<span>modes: Fresno · Biakone · GLYF · Medida · Forma</span></div><div class="t-desc">Identity layer — logo, accent, typography roles per brand. Brand changes <em>values</em>, never component anatomy.</div></div>
    <div class="tier"><div class="t-name">03 · Semantic<span>modes: Light · Dark</span></div><div class="t-desc">Contextual meaning — <code>text/*</code>, <code>bg/*</code>, <code>border/*</code>, <code>feedback/*</code>, font and logo roles. Semantic is the only Light/Dark switch in the system.</div></div>
    <div class="tier"><div class="t-name">04 · Component<span>mode: Value</span></div><div class="t-desc">Implementation layer — button, controls, optical geometry (padding, gap, overlap). Component-specific public tokens live here; no Theme mode at this layer.</div></div>
  </div>
  <div class="prose"><p style="margin-top:8px">→ <strong>UI</strong> — the layer above Component, where products consume the tokens. Spacing/radius/breakpoints may bind straight to Primitives when they're invariant across Brand and Theme; optical exceptions live as Component tokens instead.</p></div>
  <div class="prose"><h3>Mode matrix</h3></div>
  <div class="props"><div class="ph"><span>Layer</span><span>Value</span><span>Note</span></div>
    <div class="pr"><b>Primitives</b><span>Value</span><span>Raw system constants</span></div>
    <div class="pr"><b>Brand</b><span>Fresno · Biakone · GLYF · Medida · Forma</span><span>Identity context</span></div>
    <div class="pr"><b>Semantic</b><span>Light · Dark</span><span>Theme context</span></div>
    <div class="pr"><b>Component</b><span>Value</span><span>Single implementation layer</span></div>
    <div class="pr"><b>Interaction</b><span>24 web · 44 touch</span><span>Target baseline; visual glyph may be smaller</span></div>
  </div>
  <div class="prose"><h3>Component API migration</h3><p>Prior to v1.0.0, several components carried a component-level <code>Theme</code> variant. That axis is now removed from every canonical component — Light/Dark comes only from placing a component inside a Semantic context. Legacy Theme-based sets remain in Figma only as hidden, untokenized specimens kept for rollback reference — they are not part of the public API.</p></div>
  <div class="foot"><span>Fresno© — FDS</span><span>Token architecture</span></div>`;

function copyToken(name){
  try{navigator.clipboard.writeText(name);}catch(e){}
  const t=document.getElementById('toastCopy'); t.textContent='Copied · '+name; t.classList.add('show');
  clearTimeout(window.__ct); window.__ct=setTimeout(()=>t.classList.remove('show'),1400);
}

function placeholder(id){
  return `
  <div class="sec-head">
    <span class="kicker">${LABELS[id]||id}</span>
    <h1 class="sec-title"><span class="br">{</span> ${LABELS[id]||id} <span class="br">}</span></h1>

}

/* ============ SIDEBAR BUILD ============ */
function buildNav(){
  const nav=document.getElementById('nav');
  let html='';
  NAV.forEach(g=>{
    html+='<div class="nav-group">';
    if(g.label) html+=`<div class="glabel">${g.label}</div>`;
    if(g.items) g.items.forEach(i=>{ html+=link(i); });
    if(g.subs) g.subs.forEach(s=>{ html+=`<div class="nav-sub">${s.label}</div>`; s.items.forEach(i=>{ html+=link(i); }); });
    html+='</div>';
  });
  nav.innerHTML=html;
}
function link(i){ return `<a data-id="${i.id}" href="#${i.id}" onclick="closeNav()">${i.label}</a>`; }

/* ============ ROUTING ============ */
function render(id){
  if(!LABELS[id]&&id!=='overview') id='overview';
  const content=document.getElementById('content');
  content.innerHTML=`<section class="section active" id="sec-${id}">${(R[id]?R[id]():placeholder(id))}</section>`;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  document.getElementById('crumbs').innerHTML=buildCrumb(id);
  document.title=`FDS — ${LABELS[id]||id}`;
  content.scrollTop=0; window.scrollTo(0,0);
}
function route(){ const id=(location.hash||'#overview').slice(1); render(id); }
window.addEventListener('hashchange',route);

/* ============ THEME ============ */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('btn-light').classList.toggle('on',t==='light');
  document.getElementById('btn-dark').classList.toggle('on',t==='dark');
  try{localStorage.setItem('fds-theme',t)}catch(e){}
}
function initTheme(){ let t='light'; try{t=localStorage.getItem('fds-theme')||'light'}catch(e){} setTheme(t); }

R.changelog=()=>{
  const entries=CHANGELOG.map(e=>`<div class="cl-entry"><div class="cl-ver"><h3>v${e.v}</h3><span class="cl-date">${e.date}</span></div>${e.note?`<div class="cl-note">${e.note}</div>`:''}${e.items.map(([t,txt])=>`<div class="cl-item"><span class="cl-tag ${t}">${t}</span><span class="txt">${txt}</span></div>`).join('')}</div>`).join('');
  return `<div class="sec-head"><span class="kicker">Reference</span><h1 class="sec-title"><span class="br">{</span> Changelog <span class="br">}</span></h1><p class="sec-lede">Every token, component and decision logged with a semver tag. <strong>Add</strong> new · <strong>Chg</strong> changed · <strong>Brk</strong> breaking. Newest first.</p></div>${entries}<div class="foot"><span>Fresno© — FDS</span><span>Changelog</span></div>`;
};

function ic(name){const f=ICONS.find(i=>i[0]===name);return f?`<svg viewBox="0 0 24 24">${f[1]}</svg>`:'';}

    <div class="pr"><b>component</b><span>button/primary · button/neutral · button/outline</span><span>button/primary</span></div>

  <div class="prose"><h3>Migration from v0.1.0</h3></div>
  <div class="props"><div class="ph"><span>Before</span><span>After</span><span>Why</span></div>
