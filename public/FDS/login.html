<title>FDS — Fresno Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* FDS docs/cover · Color=Dark — values are FDS tokens (Semantic Dark-on-inverse) */
:root{
  --bg-inverse:#141414;            /* bg/inverse (Light) */
  --text-inverse-primary:#f4f2ea;  /* text/inverse-primary */
  --text-inverse-tertiary:#a9aea9; /* text/inverse-tertiary */
  --border-inverse-default:#4a4d4b;/* border/inverse-default */
  --border-inverse-strong:#636965; /* border/inverse-strong */
  --bg-brand:#c6dbf9;              /* bg/brand (Fresno) */
  --bg-brand-hover:#dce8fc;        /* bg/brand-hover (Dark) */
  --text-on-brand:#141414;         /* text/on-brand */
  --border-focus:#a3c3f3;          /* border/focus (Dark) */
  --feedback-error:#e2685d;        /* feedback/error (Dark) */
  --logo-inverse:#ffffe6;          /* logo/inverse (Fresno) */
  --font-ui:'Sometype Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(24px,5vw,96px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-inverse);color:var(--text-inverse-primary);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;text-transform:uppercase}
.cover{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;
  padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));padding-bottom:max(var(--pad),env(safe-area-inset-bottom))}
h1{font-weight:400;font-size:clamp(34px,4.6vw,88px);line-height:1.1;letter-spacing:0}
.sub{font-size:clamp(22px,3.75vw,72px);line-height:1.15;margin-top:.25em;word-break:break-word}
.date{font-size:clamp(14px,1.9vw,36px);margin-top:.9em}
form{margin-top:clamp(40px,7vh,96px);display:flex;flex-direction:column;gap:12px;width:min(100%,420px)}
label{font-size:11px;letter-spacing:.1em;color:var(--text-inverse-tertiary)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:6px;background:transparent;
  border:1px solid var(--border-inverse-default);color:var(--text-inverse-primary);font:inherit;font-size:16px;
  text-transform:none;letter-spacing:.04em;outline:none;transition:border-color .15s ease}
input:hover{border-color:var(--border-inverse-strong)}
input:focus-visible{border-color:var(--border-focus);box-shadow:0 0 0 1px var(--border-focus)}
button{height:48px;padding:0 20px;border:0;border-radius:6px;background:var(--bg-brand);color:var(--text-on-brand);
  font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s ease}
button:hover{background:var(--bg-brand-hover)}
button:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
.err{font-size:11px;letter-spacing:.08em;color:var(--feedback-error);min-height:14px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:48px}
.wordmark{height:clamp(14px,1.5vw,28px);width:auto;color:var(--logo-inverse)}
.face{height:clamp(56px,4.8vw,92px);width:auto}
@media (max-width:480px){.row{flex-direction:column}button{width:100%}}
</style>
</head>

        <button type="submit">Enter</button>
