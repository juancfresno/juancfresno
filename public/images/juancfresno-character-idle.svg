<svg width="72" height="252" viewBox="0 0 72 252" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Juan C. Fresno pixel character">
  <!-- juancfresno pixel character - idle animation
       grid: 1 unit = 8px
       SMIL + calcMode=discrete -> stepped pixel movement, retro game style
       legs stay planted, upper body breathes, shadow fixed on the ground -->

  <!-- shadow: fixed, touching the feet -->
  <line id="shadow" x1="16" y1="249" x2="64" y2="249" stroke="#000000" stroke-width="2" opacity="0.2"/>

  <g id="legs" fill="#272727">
    <rect x="24" y="120" width="8" height="128"/>
    <rect x="32" y="120" width="8" height="64"/>
    <rect x="40" y="120" width="8" height="16"/>
    <rect x="48" y="120" width="8" height="128"/>
    <rect x="56" y="120" width="8" height="56"/>
  </g>

  <g id="shoes" fill="#FFFFFF">
    <rect x="24" y="240" width="8" height="8"/>
    <rect x="48" y="240" width="8" height="8"/>
  </g>

  <!-- upper body: breathes (drops 2px every other beat, stepped) -->
  <g id="upper">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 2; 0 0" keyTimes="0; 0.5; 1"
      calcMode="discrete" dur="1.6s" repeatCount="indefinite"/>

    <g id="head">
      <rect id="face" x="40" y="0" width="32" height="40" fill="#FFC9A9"/>
      <rect id="hair" x="40" y="0" width="32" height="8" fill="#000000"/>
      <g id="eyes" fill="#997865">
        <animate attributeName="opacity"
          values="1; 0; 1" keyTimes="0; 0.94; 0.985"
          calcMode="discrete" dur="4.2s" repeatCount="indefinite"/>
        <rect x="48" y="16" width="8" height="8"/>
        <rect x="64" y="16" width="8" height="8"/>
      </g>
      <rect id="chin" x="40" y="40" width="16" height="8" fill="#FFC9A9"/>
    </g>

    <g id="torso" fill="#000000">
      <rect x="40" y="48" width="8" height="80"/>
      <rect x="32" y="40" width="8" height="88"/>
      <rect x="48" y="48" width="8" height="80"/>
      <rect x="24" y="56" width="8" height="64"/>
      <rect x="56" y="56" width="8" height="64"/>
      <rect x="64" y="64" width="8" height="24"/>
      <rect x="64" y="88" width="8" height="48"/>
      <rect x="64" y="104" width="8" height="32" fill="#1A1A1A"/>
    </g>

    <g id="arm-portfolio">
      <rect id="portfolio" x="0" y="104" width="40" height="32" fill="#D8D8D8"/>
      <rect id="portfolio-edge" x="32" y="104" width="8" height="32" fill="#000000"/>
      <rect id="sleeve-l" x="16" y="72" width="8" height="24" fill="#000000"/>
      <rect id="jacket-l" x="16" y="96" width="8" height="40" fill="#1A1A1A"/>
      <rect id="hand-l" x="16" y="136" width="8" height="8" fill="#FFC9A9"/>
    </g>

    <g id="arm-right">
      <rect id="cuff-r" x="64" y="136" width="8" height="8" fill="#000000"/>
      <rect id="hand-r" x="64" y="144" width="8" height="8" fill="#FFC9A9"/>
    </g>
  </g>
</svg>
